<a class="pular" href="#conteudo" (click)="pularParaConteudo($event, conteudo)"
  >Pular para o conteúdo</a
>
<header class="topo">
  <a class="marca" [routerLink]="sessao() ? '/conta/perfil' : '/conta/entrar'">
    <span class="marca-simbolo" aria-hidden="true">A</span>
    <span>ArtGoncalense</span>
  </a>
  <nav aria-label="Conta">
    @if (sessao()) {
      <a routerLink="/conta/perfil" routerLinkActive="atual" ariaCurrentWhenActive="page"
        >Meu perfil</a
      >
      <button type="button" class="botao secundario" [disabled]="saindo()" (click)="sair()">
        {{ saindo() ? 'Saindo…' : 'Sair' }}
      </button>
    } @else {
      <a routerLink="/conta/entrar" routerLinkActive="atual" ariaCurrentWhenActive="page">Entrar</a>
      <a
        class="botao secundario"
        routerLink="/conta/cadastro"
        routerLinkActive="atual"
        ariaCurrentWhenActive="page"
        >Criar conta</a
      >
    }
  </nav>
</header>
@if (erro()) {
  <p class="mensagem erro erro-global" role="alert">{{ erro() }}</p>
}
<main #conteudo id="conteudo" tabindex="-1">
  <router-outlet />
</main>
